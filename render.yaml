services:
  # The sample-data demo. Open sign-in, made-up data, no real emails.
  - type: web
    name: vectorsales-demo
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: vectorsales-demo-data
      mountPath: /var/data
      sizeGB: 1

